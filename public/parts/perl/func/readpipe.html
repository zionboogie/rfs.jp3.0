<div class="func-detail">

	<p>EXPRがシステムコマンドとして実行されます。コマンドの標準出力の内容が返されます。スカラコンテキストでは、単一の(内部的に複数行の)文字列を返します。リストコンテキストでは、行のリストを返します (但し、行は$/（$INPUT_RECORD_SEPARATOR）で定義されます)。これはqx/EXPR/演算子を実装する内部関数です。</p>

</div>
