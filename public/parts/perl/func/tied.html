<div class="func-detail">

	<p>引数に結び付けられているオブジェクトへのリファレンスを返します。引数が＠パッケージに結び付けられていなければ、未定義値を返します。</p>

	<h2 class="func-sample">tiedの使い方</h2>

	<p>下記のようにすると、ハッシュがどのパッケージに結び付けられているかを知ることができます。</p>

<pre class="brush: perl;">
ref tied %hash;
</pre>
