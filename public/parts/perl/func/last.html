<div class="func-detail">

	<p><code>last</code>コマンドは引数<code>LABEL</code>で指定したループから抜けます。<code>LABEL</code>が省略されると、一番内側のループが対象となります。<code>continue</code>ブロックがあっても実行されません</p>

	<h2 class="func-sample">lastの使い方</h2>

<pre class="brush: perl;">
while (  ) {
	last if ...; # if 文の条件式により、while ループを抜ける
	... 
} 
</pre>

	<p><code>last</code>は<code>eval {}</code>、<code>sub {}</code>、<code>do {}</code>といった値を返すブロックを終了するのには使えません。また<code><a href="grep.html">grep</a></code>や<code><a href="map.html">map</a></code>操作を終了するのに使うべきではありません。</p>

</div>
