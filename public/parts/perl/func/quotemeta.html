<div class="func-detail">

	<p>引数からすべての正規表現のメタ文字をバックスラッシュでエスケープしたものを返します。つまり、<code>/[A-Za-z_0-9]/</code>にマッチしない全ての文字の前にはロケールに関わらずバックスラッシュが前置されます。</p>

	<h2 class="func-sample">quotemetaの使い方</h2>

<pre class="brush: perl;">
print quotemeta('(\S+)\s'), "\n";
> \(\\S\+\)\\s 
</pre>
