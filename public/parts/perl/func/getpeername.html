<div class="func-detail">

	<p><code>SOCKET</code>コネクションの向こう側のパックされた<code>SOCK_ADDR</code>アドレスを返します。</p>

	<h2 class="func-sample">getpeernameの使い方</h2>

<pre class="brush: perl;">
$o_sockaddr = getpeername(SOCKET);
($port, $iaddr) = unpack_sockaddr_in($o_sockaddr);
$ip_address = inet_ntoa($iaddr);
</pre>
