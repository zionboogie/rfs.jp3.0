<div class="func-detail">

	<p><code>q//</code>
	は文字列をシングルクォートで囲んだのと同様です。バックスラッシュは次の文字が区切文字か、別のバックスラッシュである場合を除いて無視されます。区切文字やバックスラッシュが続く場合には、それがそのまま展開されます。</p>

	<h2 class="func-sample">q//の使い方</h2>

<pre class="brush: perl;">
print q!I said, "You said, 'She said it.'"!, "\n";
> I said, "You said, 'She said it.'"

print q('This is it.'), "\n";
> 'This is it.' 
</pre>

</div>
