<div class="func-detail">

	<p>SOCKETにMSGを送ります。FLAGSには、同名のシステムコールと同じフラグを指定します。接続していないソケットには、送信先TOを指定しなければならず、この場合、Cのsendtoを実行します。送信した文字数か、エラー時には、未定義値を返します。</p>
