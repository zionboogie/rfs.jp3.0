<div class="func-detail">

	<p>System V IPC関数msgrcvを呼び出し、メッセージキュー ID から、変数 VAR  に最大メッセージ長SIZEのメッセージを受信します。メッセージが受信されたならば、VAR  の先頭がメッセージタイプとなり、VARの最大長は、SIZE  にこのメッセージタイプの長さを加えたものになります。成功時には"真"を返し、エラー時には"偽"を返します。</p>

</div>
