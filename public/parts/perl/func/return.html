<div class="func-detail">

	<p>サブルーチンや<a href="eval.html"><code>eval</code></a>などから、指定した値を返します。<br />
	サブルーチンや<a href="eval.html"><code>eval</code></a>は、<code>return</code>がない場合は最後に評価した値を返します。</p>

	<h2 class="func-sample"><code>return</code>の使い方</h2>


<pre class="brush: perl;">
sub func_one{
	....
	return 1;
} 
</pre>
