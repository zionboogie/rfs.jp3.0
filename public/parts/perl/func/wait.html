<div class="func-detail">

	<p><code>wait(2)</code>システムコールと同様に振る舞います。チャイルドプロセスが終了するのを待ち、消滅したプロセスの<code>pid</code>を返します。チャイルドプロセスが存在しないときには、-1 を返します。ステータスは<code>$?</code>に返されます。返り値が -1 の場合は子プロセスが自動的に
	回収された可能性があります。
	</p>

</div>
