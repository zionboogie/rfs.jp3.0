<div class="func-detail">

<p><code>System V</code>共有メモリセグメント ID に対し、アタッチして、コピーを行ない、デタッチするという形で、位置<code>POS</code>から、サイズ<code>SIZE</code>だけ、読み込みを行ないます。読み込み時には、<code>VAR</code>は読み込んだデータを納める変数でなければなりません。成功時には&quot;真&quot;を、エラー時には&quot;偽&quot;を返します。</p>

</div>
