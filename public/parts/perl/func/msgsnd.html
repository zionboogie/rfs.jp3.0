	<p>System V IPC関数msgsndを呼び出し、メッセージキュー ID にメッセージMSGを送信します。MSGの先頭は、long整数のメッセージタイプでなければならず、これは、pack("L", $type)として生成できます。成功時には"真"を、エラー時には"偽"を返します。</p>
