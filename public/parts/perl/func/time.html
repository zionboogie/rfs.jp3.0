<div class="func-detail">

	<p><code>UTC</code>で 1970年1月1日 00:00:00 からの秒数を返します。<code>time</code>が返す値は、<a href="gmtime.html"><code>gmtime</code></a>や<a href="localtime.html"><code>localtime</code></a>、<a href="utime.html"><code>utime</code></a>にそのまま渡すことができます。</p>

	<h2 class="func-sample">timeの使い方</h2>

<pre class="brush: perl;">
print time,"\n";
> 1008773812

($sec,$min,$hour,$mday,$mon,$year,$wday,$yday,$isdst)
	= localtime(time); 
</pre>
