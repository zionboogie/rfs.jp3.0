<div class="func-detail">

	<p>配列<code>ARRAY</code>の最後に<code>LIST</code>を追加し、変更後の配列の要素数を返します。<code>ARRAY</code>の大きさは、<code>LIST</code>の長さ分だけ大きくなります。</p>

	<h2 class="func-sample">pushの使い方</h2>

<pre class="brush: perl;">
# @arrayの要素の最後に e が追加されます
push( @array, "e" ); 
</pre>
