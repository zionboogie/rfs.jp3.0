<div class="func-detail">

	<p>引数の値をファイル名展開し、呼び出すたびにマッチする次の名前を返します。</p>

	<h2 class="func-sample">globの使い方</h2>

<pre class="brush: perl;">
# カレントディレクトリにあるファイルやディレクトリ名をすべて取得する
@file = glob('*');

# カレントディレクトリにあるファイルやディレクトリ名を1つだけ取得する
$file = glob('*'); 
</pre>
