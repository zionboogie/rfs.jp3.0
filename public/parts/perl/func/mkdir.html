<div class="func-header">
	<div class="func-format">
mkdir FILENAME,MODE 
	</div>

	<div class="func-compat">
		<span class="ic-perl4"></span>
		<span class="ic-perl5"></span>
		<span class="ic-win"></span>
		<span class="ic-mac"></span>
	</div>
</div>

<div class="func-detail">

	<p>第1引数<code>FILENAME</code>で指定したディレクトリを、第2引数<code>MODE</code>で指定したパーミッションで作成します。成功時には 1 を返し、失敗時には 0 を返して、特殊変数<code>$!</code>を設定します。<font face="Trebuchet MS">引数</font><code>MODE</code>を省略すると、0777とみなします。</p>

	<h2 class="func-sample">mkdirの使い方</h2>


<pre class="brush: perl;">
mkdir $file, 0666; 
</pre>

</div>
