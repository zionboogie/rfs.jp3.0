<div class="func-detail">

	<p><code>gethostbyname</code>は、ネットワークファイル(<code>/etc/naeworks</code>)、もしくは、同等の機構から、引数<code>NAME</code>で指定されたホスト名にマッチしたネットワーク情報（ホスト名/エイリアス/アドレスタイプ/アドレスの長さ/アドレスのリスト）をリストで返します。スカラコンテキストの場合は、ホスト名を返します。</p>

	<h2 class="func-sample">gethostbynameの使い方</h2>
<pre class="brush: perl;">
@host = gethostbyname("www.rfs.jp");
</pre>

</div>
