<div class="func-detail">

	<p><code>getprotobynumber</code>は、プロトコルファイル(<code>/etc/naeworks</code>)、もしくは、同等の機構から、引数<code>NO</code>で指定されたプロトコル番号に対応したプロトコルの情報（プロトコル名/エイリアス/プロトコル番号）をリストで返します。スカラコンテキストの場合は、プロトコル名を返します。</p>

	<h2 class="func-sample">getprotobynumber</h2>

<pre class="brush: perl;">
my ($protoname, $alias ,$protnum) = getprotobynumber(6);
</pre>

</div>
