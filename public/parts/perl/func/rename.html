	</div>

	<div class="func-compat">
		<span class="ic-perl4"></span>
		<span class="ic-perl5"></span>
		<span class="ic-win"></span>

<div class="func-detail">

	<p>第1引数で指定したファイルの名前を第2引数に変更します。すでに第2引数で指定したファイルがあれば、上書きします。成功時には1、失敗時には 0 を返します。</p>

	<h2 class="func-sample">renameの使い方</h2>

<pre class="brush: perl;">
# test.html のファイル名を index.html に変更<br />
rename "test.html", "index.html"; 
</pre>

</div>
