<div class="func-detail">

	<p><code>qx//</code>は逆クォートを使ってシステムコマンドを実行するのと同様です。返却値は標準出力に出力された文字列になります。スカラコンテキストでは文字列、リストコンテキストでは行のリストを返します。</p>

	<h2 class="func-sample">qx//の使い方</h2>

<pre class="brush: perl;">
print qx{ date };
> Wed Jun 9 14:25:31 JST 2004
</pre>
