<div class="func-header">
	<div class="func-format">
link OLDFILE, NEWFILE 
	</div>

	<div class="func-compat">
		<span class="ic-perl4"></span>
		<span class="ic-perl5"></span>
		<!--<span class="ic-win"></span>
		<span class="ic-mac"></span>-->
	</div>
</div>

<div class="func-detail">

	<p>第1引数<code>OLDFILE</code>で指定したファイルのハードリンクを、第2引数<code>NEWFILE</code>として作成します。成功時には 1 を、失敗時には 0 を返します。ハードリンクを実装していないオペレーティングシステムでは使えません。</p>

	<h2 class="func-sample">linkの使い方</h2>

<pre class="brush: perl;">
link "/home/httpd/cgi-bin", "/home/user/cgi-bin"; 
</pre>


</div>
