<div class="func-detail">

	<p><a href="rand.html"><code>rand</code></a>演算子のためのシード値を設定し、実行するたびに <a href="rand.html"><code>rand</code></a>が異なる乱数列を生成できるようにします。引数を省略すると、<code>srand(time)</code>を実行します。</p>
	<p><code>srand</code>は、<a href="rand.html"><code>rand</code></a>を使う際に自動的に呼び出されるので、明示的に使用する必要はありません。ただし、5.004以前のバージョンの<code>Perl</code>では明示的に呼び出す必要があります。</p>

</div>
