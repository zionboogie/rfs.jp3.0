<div class="func-detail">

	<p>ハッシュ<code>ASSOC_ARRAY</code>の<code>value</code>を返します。</p>

	<h2 class="func-sample">valuesの使い方</h2>

<pre class="brush: perl;">
%hash = ('Akai', 27, 'Ishikawa', 30);

# スカラコンテキストでは値の個数を返す
print $key = values %hash, "\n";
> 2

foreach $value ( values %hash ) {
　　print $value, "\n";
}
> 30
> 27
</pre>
