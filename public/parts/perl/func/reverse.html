<div class="func-detail">

	<p>配列<code>LIST</code>の要素を逆順に並べかえて返します。スカラコンテキストでは、<code>LIST</code>の全要素を連結し、文字単位で逆順にして返します。</p>

	<h2 class="func-sample">reverseの使い方</h2>

<pre class="brush: perl;">
$var = "abcdefg";

# $list は "gfedcba" となります。
$list = reverse( $var ); 
</pre>
