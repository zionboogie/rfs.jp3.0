<div class="func-detail">

	<p><code>System V IPC</code>関数<code>shmctl</code>を呼び出します。<code>CMD</code>が、<code>&amp;IPC_STAT</code>ならば、<code>ARG</code>は、返される<code>shmid</code>構造体を納める変数でなければなりません。<code>ioctl</code>と同じように、エラー時には未定義値、ゼロのときは<code>&quot;0 but true&quot;</code>、それ以外なら、その値そのものを返します。</p>

</div>
