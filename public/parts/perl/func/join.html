<div class="func-detail">
	<p><code>LIST</code>の要素を<code>EXPR</code>で結合し、その文字列を返します。</p>

	<h2 class="func-sample">joinの使い方</h2>

<pre class="brush: perl;">
@list = (One, Tow, Three);
print join( ":" , @list);
> One:Tow:Three 
</pre>

	<p>逆変換には<a href="split.html"><code>split</code></a>を使います。</p>
