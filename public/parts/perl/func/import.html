	<p>組み込みの<code>import</code>関数というものはありません。これは単に、別のモジュールに名前をエクスポートしたいモジュールが定義した(継承した)、通常のメソッド(サブルーチン)です。</p><p><code><a href="use.html">use</a></code>関数は、使用されるパッケージのために、<code>import</code>メソッドを呼び出します。</p>
